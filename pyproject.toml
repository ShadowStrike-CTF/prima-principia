[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prima-principia"
version = "1.0.0"
description = "Prerequisite-aware university course schedule generator. Development in progress."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 1 - Planning",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/ShadowStrike-CTF/prima-principia"
"Bug Tracker" = "https://github.com/ShadowStrike-CTF/prima-principia/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["course_planner*"]
